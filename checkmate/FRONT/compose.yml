version: "3.9"

services:
  frontend:
    container_name: checkmate-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
        REACT_APP_API_TIMEOUT: ${REACT_APP_API_TIMEOUT:-10000}
        REACT_APP_PROXY_PATH: ${REACT_APP_PROXY_PATH:-/api}
        REACT_APP_PROXY_TARGET: ${REACT_APP_PROXY_TARGET:-http://3.35.87.73:8080}
    ports:
      - "80:3000"
    restart: unless-stopped
    # .env.production 은 build 시 자동 사용되며 Git에 포함되지 않음
